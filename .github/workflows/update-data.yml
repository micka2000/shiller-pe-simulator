name: Mise à jour des données

on:
  schedule:
    # Après la clôture de Wall Street, du lundi au vendredi
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests du script de données
        run: python -m unittest discover tests

      - name: Récupérer le CAPE et le prix du S&P 500
        run: python scripts/update_data.py

      - name: Commit si les données ont changé
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add docs/data/market.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Données du $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push fait avec GITHUB_TOKEN ne relance pas toujours le build Pages
      - name: Relancer le build GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
